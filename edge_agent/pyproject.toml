[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vms-edge-agent"
version = "1.0.0"
description = "VMS MVP — Edge Agent (ffmpeg stream manager)"
requires-python = ">=3.12"
dependencies = [
    # HTTP client
    "httpx>=0.28",
    # WebSocket client (config push)
    "websockets>=13.0",
    # Validação / settings
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # Logging estruturado
    "structlog>=24.4",
    # Hardware detection
    "psutil>=5.9",
    # Serviço nativo Windows (instalador — ver native_installer/windows/)
    "pywin32>=306; sys_platform == 'win32'",
]
# NOTA (Next Sec): ultralytics/opencv-python-headless/numpy removidos —
# nunca importados em código real (só um `import torch` opcional e já
# guardado por try/except em hardware.py, pra detecção de acelerador). Eram
# só peso morto: infla o build Docker à toa e inviabilizaria um instalador
# nativo "leve" (torch sozinho é centenas de MB).

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-bdd>=7.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.21",
]
# Empacotamento do instalador nativo (Windows/Linux) — não vai pro container
# Docker de referência, só pro build do executável standalone.
packaging = [
    "pyinstaller>=6.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src/agent"]

[tool.coverage.report]
show_missing = true
fail_under = 80
