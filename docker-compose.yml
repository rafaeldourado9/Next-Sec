services:
  # ─── Infraestrutura ──────────────────────────────────────────────────────
  postgres:
    build:
      context: ./infra/postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-next_sec}
      POSTGRES_USER: ${POSTGRES_USER:-next_sec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-next_sec_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-next_sec} -d ${POSTGRES_DB:-next_sec}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [next_sec]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [next_sec]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-next_sec}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-next_sec_dev}
    ports:
      - "15672:15672"   # management UI (dev only)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [next_sec]

  # ─── Arcanum (gateway WhatsApp self-hosted — notificações a contatos, ver ADR-009) ─
  # Envio apenas — o ChannelAdapter (notifications/channel_adapter.py) só chama
  # sendText/sendMedia, não configura webhook de entrada.
  arcanum:
    build:
      context: ./arcanum
    restart: unless-stopped
    environment:
      - GATEWAY_PORT=3100
    volumes:
      - arcanum_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [next_sec]

  # ─── Streaming (ingestão RTSP para leitura de frames pelo analytics) ──────
  mediamtx:
    build:
      context: ./infra/mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP
      - "1935:1935"   # RTMP (push do edge agent)
    environment:
      # Base URL do publish-auth + hooks on_ready/on_not_ready/
      # on_record_segment_complete (ver entrypoint.sh/mediamtx.yml) — aqui,
      # mesma rede Docker do serviço `api`.
      - VMS_HOOKS_BASE_URL=http://api:8000
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml.template:ro
      - recordings:/recordings
    healthcheck:
      # curl não existe nesta imagem (ver infra/mediamtx/Dockerfile) — só
      # wget (Alpine/BusyBox). Com curl o healthcheck falhava sempre,
      # marcando o container "unhealthy" mesmo com o mediamtx saudável.
      test: ["CMD", "wget", "-qO-", "http://localhost:9997/v3/config/global/get"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [next_sec]
    # Gravação contínua é opt-in por câmera (cameras.recording_enabled),
    # ligada via API pelo cameras/mediamtx.py — ver infra/mediamtx/mediamtx.yml.

  # ─── WireGuard (túnel do agent — resolve CGNAT/ausência de IP fixo do
  # cliente. Hub aqui, peer do lado do agent — ver plano do túnel) ──────────
  wireguard:
    build:
      context: ./infra/wireguard
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    ports:
      - "51820:51820/udp"
    environment:
      - WG_HUB_ADDRESS=10.60.0.1/24
      - WG_LISTEN_PORT=51820
      - WG_CONTROL_TOKEN=${WG_CONTROL_TOKEN:-dev-wg-control-key}
      - WG_PUBLIC_ENDPOINT=${WG_PUBLIC_ENDPOINT:-localhost:51820}
      - VMS_API_INTERNAL_URL=http://api:8000
      - MEDIAMTX_RTMP_INTERNAL=mediamtx:1935
    volumes:
      - wireguard_data:/etc/wireguard
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # python3 (não wget/curl — nenhum dos dois vem por padrão no
      # python:3.12-slim, e não vale a pena um apt-get extra só pra isso)
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [next_sec]

  # ─── API Service ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      target: production
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-next_sec}:${POSTGRES_PASSWORD:-next_sec_dev}@postgres:5432/${POSTGRES_DB:-next_sec}
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-next_sec}:${RABBITMQ_PASSWORD:-next_sec_dev}@rabbitmq:5672/
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-prod}
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - MEDIAMTX_RTMP_URL=rtmp://mediamtx:1935
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-miniosecret}
      - MINIO_BUCKET_SNAPSHOTS=${MINIO_BUCKET_SNAPSHOTS:-nextsec-snapshots}
      - MINIO_BUCKET_CLIPS=${MINIO_BUCKET_CLIPS:-nextsec-clips}
      - MINIO_BUCKET_ANALYTICS=${MINIO_BUCKET_ANALYTICS:-nextsec-analytics}
      # Storage adapter — destino final do clipe/frame (ver ADR-010, revisado:
      # MinIO local na VPS, Google Drive adiado a pedido do usuário)
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - CLIP_RETENTION_DAYS=${CLIP_RETENTION_DAYS:-30}
      # Channel adapter — canal de notificação (ver ADR-009)
      - NOTIFICATION_CHANNEL=${NOTIFICATION_CHANNEL:-whatsapp}
      - ARCANUM_BASE_URL=${ARCANUM_BASE_URL:-http://arcanum:3100}
      - ARCANUM_INSTANCE_NAME=${ARCANUM_INSTANCE_NAME:-next-sec}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - VMS_API_KEY=${VMS_API_KEY:-dev-analytics-key}
      # Túnel WireGuard do agent (resolve CGNAT — ver plano do túnel)
      - WG_HUB_INTERNAL_URL=http://wireguard:8080
      - WG_CONTROL_TOKEN=${WG_CONTROL_TOKEN:-dev-wg-control-key}
      - WG_PUBLIC_ENDPOINT=${WG_PUBLIC_ENDPOINT:-localhost:51820}
      - WG_SUBNET=${WG_SUBNET:-10.60.0.0/24}
    volumes:
      - ./api:/app
      - snapshots:/snapshots
      - reports:/reports
      - tunnel_data:/tunnel:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [next_sec]

  # ─── Worker (ARQ background tasks — notificações, audit, lgpd, eventos) ──
  worker:
    build:
      context: ./api
      target: production
    restart: unless-stopped
    command: python -m arq vms.worker.WorkerSettings
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-next_sec}:${POSTGRES_PASSWORD:-next_sec_dev}@postgres:5432/${POSTGRES_DB:-next_sec}
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-next_sec}:${RABBITMQ_PASSWORD:-next_sec_dev}@rabbitmq:5672/
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-prod}
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-miniosecret}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - CLIP_RETENTION_DAYS=${CLIP_RETENTION_DAYS:-30}
      - NOTIFICATION_CHANNEL=${NOTIFICATION_CHANNEL:-whatsapp}
      - ARCANUM_BASE_URL=${ARCANUM_BASE_URL:-http://arcanum:3100}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_EVENT_CLIPS=${ENABLE_EVENT_CLIPS:-true}
    volumes:
      - snapshots:/snapshots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r = redis.Redis(host='redis'); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [next_sec]

  # ─── Worker Low Priority (Relatórios PDF) ─────────────────────────────────
  worker-low:
    build:
      context: ./api
      target: production
    restart: unless-stopped
    command: python -m arq vms.worker.LowPriorityWorkerSettings
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-next_sec}:${POSTGRES_PASSWORD:-next_sec_dev}@postgres:5432/${POSTGRES_DB:-next_sec}
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-next_sec}:${RABBITMQ_PASSWORD:-next_sec_dev}@rabbitmq:5672/
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-prod}
      - REPORTS_PATH=/reports
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - reports:/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [next_sec]

  # ─── Analytics Service (intrusion + face_recognition — analíticos leves) ──
  analytics:
    build:
      context: ./analytics
      target: ${ANALYTICS_TARGET:-cpu}   # cpu para dev/VPS atual, gpu se migrar depois
    restart: unless-stopped
    environment:
      - VMS_API_URL=http://api:8000
      - VMS_API_KEY=${VMS_API_KEY:-dev-analytics-key}
      - MEDIAMTX_HOST=mediamtx
      - REDIS_URL=redis://redis:6379/1
      - ANALYTICS_FPS=3
      - YOLO_IMGSZ=640
      - YOLO_CONF=0.30
      - YOLO_MODEL_PATH=/models/object.pt
      - FACE_RECOGNITION_MODEL_PATH=${FACE_RECOGNITION_MODEL_PATH:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./analytics/models:/models:ro
      - snapshots:/snapshots
    depends_on:
      api:
        condition: service_healthy
      mediamtx:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Ver comentário equivalente em docker-compose.edge.yml (achado no
      # smoke test de S6-06): `Orchestrator.start()` pode levar até ~100s
      # (10 tentativas x 10s) pra listar câmeras antes do Uvicorn aceitar
      # conexão — sem start_period isso é sinalizado como "unhealthy" por
      # um startup normal (tenant sem câmera ainda), não uma falha real.
      start_period: 150s
    networks: [next_sec]

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    networks: [next_sec]

  # ─── Edge Agent (referência local — roda de fato na rede do cliente) ─────
  edge-agent:
    build:
      context: ./edge_agent
    restart: unless-stopped
    environment:
      - AGENT_ID=edge-agent-01
      - AGENT_API_KEY=${VMS_API_KEY:-dev-analytics-key}
      - VMS_API_URL=http://api:8000
      - MEDIAMTX_RTMP_URL=rtmp://mediamtx:1935
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - edge_agent_data:/app/data
    depends_on:
      - api
      - mediamtx
    healthcheck:
      test: ["CMD", "python", "-c", "print('agent running')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [next_sec]
    profiles: [agent]          # `docker compose --profile agent up` — só para teste local

  # ─── Nginx (reverse proxy) ────────────────────────────────────────────────
  nginx:
    build:
      context: ./infra/nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      # Webroot do desafio ACME — escrita pelo certbot, leitura pelo nginx.
      - ./infra/nginx/certbot:/var/www/certbot:ro
      # Certificados do Let's Encrypt. O entrypoint só habilita o bloco :443
      # se encontrar o fullchain.pem aqui (ver infra/nginx/docker-entrypoint.sh).
      - letsencrypt:/etc/letsencrypt:ro
      # Instalador do agent (Windows) — build via PyInstaller, ver
      # native_installer/windows/. Binário não vai pro git (veja .gitignore);
      # precisa ser gerado uma vez e colocado em release/ antes do deploy.
      - ./native_installer/windows/release:/usr/share/nginx/agent-downloads:ro
      # Instalador Nível 1 (Docker dedicado) — ver Sprint 7,
      # native_installer/windows-docker/. Só scripts + o compose file,
      # nenhum binário — pode ir pro git direto.
      - ./native_installer/windows-docker/release:/usr/share/nginx/agent-docker-downloads:ro
    depends_on:
      - api
      - frontend
    healthcheck:
      # curl não existe nesta imagem (ver infra/nginx/Dockerfile) — só wget
      # (Alpine/BusyBox). Path também estava errado (/health não existe;
      # o proxy expõe /api/v1/health). Com isso o healthcheck falhava
      # sempre, marcando o container "unhealthy" mesmo com o nginx saudável.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [next_sec]

  # ─── MinIO (staging S3-compatível de snapshot/clipe antes do storage adapter) ─
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-miniosecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [next_sec]

  # ─── Cloudflare Tunnel (expõe a stack p/ config de webhook de câmera) ─────
  # Sem profile — sobe sempre junto com o resto (usuário pediu, pra não
  # precisar lembrar de --profile dev toda vez). Quando migrar pra uma VPS
  # com domínio próprio (DuckDNS/certbot), revisitar: provavelmente desliga
  # esse quick tunnel de vez em favor do domínio real.
  cloudflared:
    build:
      context: ./infra/cloudflared
    restart: unless-stopped
    command: >
      --url http://nginx:80
      --protocol http2
      --no-autoupdate
    volumes:
      - tunnel_data:/tunnel
    depends_on:
      - nginx
    networks: [next_sec]

  # ─── Backup do Postgres (dados de tenant/evento/audit/LGPD — sem vídeo) ───
  backup-scheduler:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "
        while true; do
          echo '[$$(date)] Running backup...';
          PGPASSWORD=$$PGPASSWORD pg_dump -h $$POSTGRES_HOST -p $$POSTGRES_PORT -U $$POSTGRES_USER -d $$POSTGRES_DB | gzip > /backups/nextsec-backup-$$(date +\%Y\%m\%d_\%H\%M\%S).sql.gz;
          echo '[$$(date)] Backup completed';
          find /backups -name 'nextsec-backup-*' -mtime +$$RETENTION_DAYS -delete;
          echo '[$$(date)] Old backups cleaned';
          sleep 86400;
        done
      "
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-next_sec}
      - POSTGRES_USER=${POSTGRES_USER:-next_sec}
      - PGPASSWORD=${POSTGRES_PASSWORD:-next_sec_dev}
      - RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [next_sec]

volumes:
  pgdata:
  snapshots:
  backups:
  tunnel_data:
  edge_agent_data:
  reports:
  minio_data:
  arcanum_data:
  recordings:
  wireguard_data:
  # Certificados emitidos pelo certbot (ver docs/DEPLOY_VPS.md). Volume
  # nomeado, e não bind mount, pra sobreviver a um `git clean` no diretório
  # do projeto — perder a chave privada obrigaria a reemitir o certificado.
  letsencrypt:

networks:
  next_sec:
    driver: bridge
