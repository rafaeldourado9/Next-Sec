[project]
name = "vms-analytics"
version = "1.0.0"
description = "VMS Analytics Service — Plugin-based video analytics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "redis>=5.0,<6",
    # Fila ARQ local — usada só quando edge_deployment=True, pra avisar o
    # worker de edge (EdgeWorkerSettings, api/vms/worker_edge.py) que um
    # evento foi ingerido com sucesso e o clipe pode ser gerado localmente
    # (ver ADR-017 §1). Já é dependência do api/, reaproveitada aqui.
    "arq>=0.26,<1",
    "numpy>=1.26,<3",
    # contrib (não só o base) — dnn_superres é usado pra melhorar o frame do
    # evento sob demanda (ver analytics/core/frame_enhance.py)
    "opencv-contrib-python-headless>=4.9,<5",
    "ultralytics>=8.1,<9",
    "fast-plate-ocr>=0.2,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "structlog>=24.1,<25",
    # Reconhecimento facial — ver ADR-014 (buffalo_s, CPU-only)
    "insightface>=0.7,<1",
    "onnxruntime>=1.18,<2",
    # GFPGAN — restauração de rosto pro "Analisar Evento" quando o recorte
    # tem um rosto (ver core/frame_enhance.py). torch/torchvision já vêm
    # pelo ultralytics — custo marginal aqui é só gfpgan+facexlib+basicsr.
    "gfpgan>=1.3,<2",
    "facexlib>=0.3,<1",
    "basicsr>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<6",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PLR"]
ignore = ["PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
