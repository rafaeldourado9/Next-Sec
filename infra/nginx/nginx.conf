worker_processes auto;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # DNS interno do Docker
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Este nginx nunca fala TLS diretamente ($scheme aqui é sempre "http") —
    # em produção ele fica atrás do nginx do FastOS, que termina TLS e manda
    # X-Forwarded-Proto: https (ver deploy/next-sec-prod-vhost.conf). Sem
    # isso, o proxy_redirect do MediaMTX (location /hls/) absolutiza a URL
    # do cookie-check com "http://", e o navegador bloqueia como Mixed
    # Content numa página https. Em dev local (sem proxy na frente), o
    # header não vem e cai no default ($scheme = http), sem mudança de
    # comportamento.
    map $http_x_forwarded_proto $external_scheme {
        default $scheme;
        https   https;
        http    http;
    }

    # ── Rate Limiting ──────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_general:10m    rate=200r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m        rate=300r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m           rate=10r/m;
    limit_req_zone $binary_remote_addr zone=public_webhook:10m rate=1200r/m;
    limit_req_zone $binary_remote_addr zone=recordings:10m     rate=600r/m;

    # ── Logging JSON ───────────────────────────────────────────────────────────
    log_format json escape=json
        '{"time":"$time_iso8601",'
         '"remote_addr":"$remote_addr",'
         '"method":"$request_method",'
         '"uri":"$request_uri",'
         '"status":$status,'
         '"body_bytes":$body_bytes_sent,'
         '"request_time":$request_time}';

    access_log /var/log/nginx/access.log json;
    error_log  /var/log/nginx/error.log warn;

    # ── Upstreams ──────────────────────────────────────────────────────────────
    upstream vms_api      { server api:8000;      keepalive 32; }
    upstream vms_frontend { server frontend:80;   keepalive 16; }
    upstream mediamtx_hls      { server mediamtx:8888; }
    upstream mediamtx_webrtc   { server mediamtx:8889; }
    upstream mediamtx_playback { server mediamtx:9996; }

    # ── Servidor HTTP (cloudflared faz TLS externamente) ──────────────────────
    server {
        listen 80;
        server_name _;
        client_max_body_size 10m;

        add_header X-Content-Type-Options "nosniff"                    always;
        add_header X-Frame-Options        "DENY"                       always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # ── Desafio ACME (certbot webroot) ──────────────────────────────────
        # Serve o arquivo de validação HTTP-01 do Let's Encrypt direto do
        # volume compartilhado — usado quando o Next Sec fica atrás de um
        # proxy reverso externo (ex: nginx compartilhado numa VPS) que só
        # repassa a porta 80 pra cá, sem terminar TLS ele mesmo ainda emitir
        # o certificado (ver docs/DEPLOY_VPS.md).
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        include /etc/nginx/locations.conf;
    }

    include /etc/nginx/ssl/*.conf;
}
