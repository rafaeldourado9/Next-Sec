# next-sec.conf — vhost do Next Sec no nginx compartilhado do FastOS
server {
    listen 80;
    server_name vm-server.duckdns.org;
    resolver 127.0.0.11 valid=10s;

    location /.well-known/acme-challenge/ {
        set $nextsec_up http://next_sec-nginx-1:80;
        proxy_pass $nextsec_up;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name vm-server.duckdns.org;
    ssl_certificate     /etc/letsencrypt/live/vm-server.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vm-server.duckdns.org/privkey.pem;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 25m;
    location / {
        set $nextsec_up http://next_sec-nginx-1:80;
        proxy_pass $nextsec_up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
